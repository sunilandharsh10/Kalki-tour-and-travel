<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StayHub | Dynamic Hotel Booking - Price per Person & Night</title>

    <!-- CSS -->
    <link rel="preload" href="assets/css/index.css"    as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="assets/css/footer.css"    as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="assets/css/hotel.css"    as="style" onload="this.onload=null;this.rel='stylesheet'">

    <!-- JS -->
    <script src="../assets/js/layout.js" defer></script>
    <script src="assets/js/hotel.js" defer></script>

     <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 (free icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />


</head>
<body>
    <span id="header"></span>
<div class="container">
    <div class="hotel_hero">
        <h1>🏨 StayHub</h1>
        <p>100+ hotels · Dynamic pricing per person & night · Custom amenities</p>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>📍 City</label>
            <select id="citySelect">
                <option value="all">All Cities</option>
                <option value="Prayagraj">Prayagraj</option>
                <option value="Lunckow">Lunckow</option>
                <option value="Ayodhya">Ayodhya</option>
                <option value="Varanasi">Varanasi</option>
            </select>
        </div>
        <div class="filter-group search-group">
            <label>🔍 Search Hotel</label>
            <input type="text" id="searchInput" placeholder="Hotel name or amenity...">
        </div>
        <div class="filter-group sort-group">
            <div>
                <label>Sort by</label>
                <select id="sortSelect">
                    <option value="none">Default</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="rating">Rating: High to Low</option>
                </select>
            </div>
        </div>
    </div>

    <div id="hotelsGridContainer" class="hotels-grid">
        <div class="loading-spinner"><div class="spinner"></div> Loading amazing stays...</div>
    </div>
</div>

<div id="footer"></div>

<!-- Booking Modal with Persons & Nights -->
<div id="bookingModal" class="booking-modal">
    <div class="modal-content">
        <h3 id="modalHotelName">Hotel Name</h3>
        <div id="modalAmenitiesList"></div>

        <div class="form-group">
            <label>👥 Number of Persons</label>
            <input type="number" id="personsCount" min="1" max="10" value="2">
        </div>
        <div class="form-group">
            <label>🌙 Number of Nights</label>
            <input type="number" id="nightsCount" min="1" max="30" value="1">
        </div>

        <div class="price-breakdown">
            <div class="price-row">
                <span>Base Price (per person / night):</span>
                <span id="basePerPerson">₹0</span>
            </div>
            <div class="price-row">
                <span>Selected Amenities (per person / night):</span>
                <span id="amenitiesPerPerson">₹0</span>
            </div>
            <div class="price-row">
                <span>Total per person / night:</span>
                <span id="totalPerPerson">₹0</span>
            </div>
            <div class="price-row">
                <span>👥 Persons: <span id="displayPersons">0</span> &nbsp; × &nbsp; 🌙 Nights: <span id="displayNights">0</span></span>
                <span></span>
            </div>
            <div class="price-row total">
                <span>💰 GRAND TOTAL</span>
                <span id="grandTotal">₹0</span>
            </div>
        </div>

        <div class="form-group">
            <label>🙏 Full Name</label>
            <input type="text" id="fullName" placeholder="Rajesh Sharma" required>
        </div>
        <div class="form-group">
            <label>📞 Mobile (WhatsApp)</label>
            <input type="tel" id="mobileNo" placeholder="9876543210" required>
        </div>
        <div class="form-group">
            <label>🏠 Address</label>
            <textarea id="address" rows="2" placeholder="Your address" required></textarea>
        </div>

        <button id="sendWhatsAppBtn" class="send-wa-btn">📲 Send Booking on WhatsApp</button>
        <button id="closeBookingModalBtn" class="close-modal-btn">Cancel</button>
    </div>
</div>
</body>
</html>
